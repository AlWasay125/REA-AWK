[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./reverseai.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatter]
default_log_format = %(levelname)-5.5s [%(name)s] %(message)s

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = default

[formatter_default]
format = %(levelname)-5.5s [%(name)s] %(message)s
