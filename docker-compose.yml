version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: reverseai-postgres
    environment:
      POSTGRES_DB: reverseai
      POSTGRES_USER: reverseai
      POSTGRES_PASSWORD: reverseai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: reverseai-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
